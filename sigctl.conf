# SigCtl Supervisor Configuration File

# Number of worker processes to maintain in the pool (1 to 32)
worker_count = 4

# Maximum seconds to wait for workers to gracefully exit before SIGKILL escalation (1 to 60)
shutdown_timeout_s = 5

# Maximum seconds without a heartbeat before a worker is marked hung and restarted (1 to 60)
heartbeat_timeout_s = 5

# Maximum crash restarts allowed per worker slot within a 60-second window (0 to 100)
max_restarts = 5

# Verbose logging flag (1 = enable DEBUG logs, 0 = INFO and above)
verbose = 0
